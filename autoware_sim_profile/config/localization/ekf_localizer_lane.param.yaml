# The EKF at a lane's half width (swb roadmap 063 d): ekf_localizer.param.yaml with only the
# covariance-ellipse diagnostics' lateral thresholds changed (test_profile.py holds the rest
# equal), selected with the profile's ekf_localizer_param_path:=<this file>. The same reasons
# and values as localization_error_monitor_lane.param.yaml: WARN and ERROR at 1.75 m, half a
# 3.5 m lane, since a WARN already ends autonomous mode; the long axis and ellipse_scale as in
# the base file. The filter itself (noise, gates, rates) is unchanged.
/**:
  ros__parameters:
    node:
      show_debug_info: false
      enable_yaw_bias_estimation: true
      # CARLA simulation runs at ~20Hz, so reduce predict/tf rates accordingly
      # Original: 50.0, but CARLA async mode limits to ~20Hz
      predict_frequency: 20.0
      tf_rate: 20.0
      extend_state_step: 20

    pose_measurement:
      # for Pose measurement
      pose_additional_delay: 0.0
      pose_measure_uncertainty_time: 0.01
      # Reduced smoothing steps for CARLA's lower update rate
      # Original: 5, but with 20Hz predict, smoothing_time = 5*0.05 = 0.25s which is too long
      # With 2 steps: smoothing_time = 2*0.05 = 0.1s
      pose_smoothing_steps: 2
      pose_gate_dist: 49.5 # corresponds to significance level = 10^-10

    twist_measurement:
      # for twist measurement
      twist_additional_delay: 0.0
      twist_smoothing_steps: 2
      twist_gate_dist: 46.1 # corresponds to significance level = 10^-10

    process_noise:
      # for process model
      proc_stddev_yaw_c: 0.005
      proc_stddev_vx_c: 10.0
      proc_stddev_wz_c: 5.0

    simple_1d_filter_parameters:
      #Simple1DFilter parameters
      z_filter_proc_dev: 1.0
      roll_filter_proc_dev: 0.1
      pitch_filter_proc_dev: 0.1

    diagnostics:
      # for diagnostics
      pose_no_update_count_threshold_warn: 50
      pose_no_update_count_threshold_error: 100
      twist_no_update_count_threshold_warn: 50
      twist_no_update_count_threshold_error: 100
      ellipse_scale: 3.0
      # At a lane's half width (see localization_error_monitor_lane.param.yaml)
      error_ellipse_size: 10.0
      warn_ellipse_size: 5.0
      error_ellipse_size_lateral_direction: 1.75
      warn_ellipse_size_lateral_direction: 1.75

    misc:
      # for velocity measurement limitation (Set 0.0 if you want to ignore)
      threshold_observable_velocity_mps: 0.0 # [m/s]
      pose_frame_id: "map"
