# The profile's copy of autoware_launch 1.5.0's config/control/vehicle_cmd_gate/vehicle_cmd_gate.param.yaml.
# Only change (scensim issue 190): nominal.lon_acc_lim_for_lon_vel 6.0 and lon_jerk_lim_for_lon_acc 12.0
# below 20 m/s (upstream 5.0 and 5.0), so the MRM emergency stop's -6.0 m/s^2 at -12 m/s^3 passes the
# gate's filter, which it also applies to the emergency command. The same filter bounds normal
# driving, so its ceiling rises with it; the planner's own limits keep normal driving below it.
/**:
  ros__parameters:
    update_rate: 10.0
    system_emergency_heartbeat_timeout: 0.5
    use_emergency_handling: true
    check_external_emergency_heartbeat: $(var check_external_emergency_heartbeat)
    enable_cmd_limit_filter: true
    filter_activated_count_threshold: 5
    filter_activated_velocity_threshold: 1.0
    external_emergency_stop_heartbeat_timeout: 0.0
    stop_hold_acceleration: -1.5
    emergency_acceleration: -2.4
    moderate_stop_service_acceleration: -1.5
    stop_check_duration: 1.0
    nominal:
      vel_lim: 25.0
      reference_speed_points: [0.1, 0.3, 20.0, 30.0]
      steer_cmd_lim: [1.0, 1.0, 1.0, 0.8]
      steer_rate_lim_for_steer_cmd: [1.0, 1.0, 1.0, 0.8]
      lon_acc_lim_for_lon_vel: [6.0, 6.0, 6.0, 4.0]  # scensim issue 190: upstream [5.0, 5.0, 5.0, 4.0]
      lon_jerk_lim_for_lon_acc: [80.0, 12.0, 12.0, 4.0]  # scensim issue 190: upstream [80.0, 5.0, 5.0, 4.0]. The first element is required for quick pedal changes when stopping and starting.
      lat_acc_lim_for_steer_cmd: [5.0, 5.0, 5.0, 4.0]
      lat_jerk_lim_for_steer_cmd: [7.0, 7.0, 7.0, 6.0]
      lat_jerk_lim_for_steer_rate: 10.0
      steer_cmd_diff_lim_from_current_steer: [1.0, 1.0, 1.0, 0.8]
    on_transition:
      vel_lim: 50.0
      reference_speed_points: [20.0, 30.0]
      steer_cmd_lim: [1.0, 0.8]
      steer_rate_lim_for_steer_cmd: [1.0, 0.8]
      lon_acc_lim_for_lon_vel: [1.0, 0.9]
      lon_jerk_lim_for_lon_acc: [0.5, 0.4]
      lat_acc_lim_for_steer_cmd: [2.0, 1.8]
      lat_jerk_lim_for_steer_cmd: [7.0, 6.0]
      lat_jerk_lim_for_steer_rate: 10.0
      steer_cmd_diff_lim_from_current_steer: [1.0, 0.8]
